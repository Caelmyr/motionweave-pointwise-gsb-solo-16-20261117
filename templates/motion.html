<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotionWeave · 动态影像编排</title><link rel="stylesheet" href="/static/motion.css"></head><body><header><div><b>MotionWeave</b><span>动态影像编排 / SOURCE → TIMELINE → PIXELS</span></div><a href="/prepare">图像准备 ↗</a></header><main><aside><h3>工作区</h3><button id="demo">创建合成演示</button><button id="new">新建空工程</button><select id="projects" aria-label="选择工程"></select><div id="summary"></div><h3>源序列</h3><input id="upload" type="file" accept="image/*" multiple><label>单帧秒数<input id="frameDuration" type="number" value="0.25" step="0.05"></label><button id="import">导入图像序列</button><div id="sources"></div><h3>工程设置</h3><label>画布宽<input id="width" type="number"></label><label>画布高<input id="height" type="number"></label><label>帧率<input id="fps" type="number"></label><label>背景RGBA<input id="background" value="[0.035,0.05,0.08,1]"></label><button id="settings">保存合成设置</button><div class="row"><button id="undo">撤销</button><button id="redo">重做</button></div></aside><section><div class="topline"><h1 id="title">源时间驱动的影像编排</h1><span id="rev">READY</span></div><div class="stage"><img id="preview" alt="合成预览"><div id="empty">创建演示，探索时间、运动与像素的关系</div></div><div class="scrub"><button id="play">播放</button><input id="scrubber" type="range" min="0" max="4" step="0.01" value="0"><input id="time" type="number" min="0" step="0.01" value="0"><span id="total"></span></div><pre id="inspect">暂无时间来源信息</pre><h3>片段轨道 <small>左闭右开 · 源关键帧不随剪辑改写</small></h3><div id="timeline"></div><div class="captures"><h3>不可变捕获</h3><button id="capture">捕获PNG序列</button><div id="captures"></div></div></section><aside class="editor"><h3>片段属性</h3><select id="clipSelect" aria-label="选择片段"></select><label>开始 / 合成秒<input id="start" type="number" step="0.01"></label><label>长度 / 合成秒<input id="length" type="number" step="0.01"></label><div class="row"><label>入点 / 源秒<input id="in" type="number" step="0.01"></label><label>出点 / 源秒<input id="out" type="number" step="0.01"></label></div><label>轨道<input id="lane" type="number" min="0" max="15"></label><label><input id="reverse" type="checkbox">倒放</label><label><input id="enabled" type="checkbox">显示片段</label><label>不透明度<input id="opacity" type="number" min="0" max="1" step="0.05"></label><label>混合<select id="blend"><option value="normal">正常</option><option value="multiply">正片叠底</option><option value="screen">滤色</option></select></label><label>遮罩羽化 / 源像素<input id="feather" type="number" min="0" max="64"></label><h3>遮罩跟踪 <small>在源帧上圈定区域，沿前后帧跟踪位置/旋转/大小</small></h3><div id="trackPanel" class="track-panel"><div class="track-head"><label class="mini">源帧<select id="trackFrame"></select></label><button id="useMask" type="button" class="mini-btn">取当前遮罩</button><button id="clearRoi" type="button" class="mini-btn">清空重圈</button></div><canvas id="trackCanvas" width="240" height="180"></canvas><p class="hint">单击添加顶点，双击或点首点闭合；闭合后可拖动顶点微调</p><div class="row"><button id="setAnchor" type="button">存为锚点关键帧</button><button id="track" type="button">从锚点跟踪</button></div><div class="row"><label class="mini">起帧<input id="trackFirst" type="number" min="0"></label><label class="mini">止帧<input id="trackLast" type="number" min="0"></label></div><div id="reliability" class="reliability"></div><div id="trackLegend" class="legend"><span class="dot anchor"></span>锚点<span class="dot reliable"></span>可靠<span class="dot marginal"></span>存疑<span class="dot failed"></span>丢失/遮挡<span class="dot untracked"></span>未跟踪</div></div><label>运动关键帧（源秒）<textarea id="transform" rows="6"></textarea></label><label>遮罩关键帧（源秒、归一化顶点）<textarea id="mask" rows="6"></textarea></label><button id="save">保存片段</button><div class="row"><button id="split">在当前时间分割</button><button id="duplicate">复制到下一轨</button></div><div class="row"><button id="delete">删除</button><button id="ripple">波纹删除</button></div><h3>替换源帧</h3><select id="replaceSource"></select><input id="replaceIndex" type="number" min="0" value="0"><input id="replaceFile" type="file" accept="image/*"><button id="replace">替换所选帧</button></aside></main><div id="toast" role="status"></div><script src="/static/motion.js"></script></body></html>
